name: Web app tests

on:
  push:
    paths:
      - "webapp/**"
      - ".github/workflows/webapp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test 'webapp/tests/*.test.mjs'
